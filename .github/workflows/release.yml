name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  ARD_VERSION: v0.40.0
  CGO_ENABLED: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            go_target: linux/amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            go_target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            go_target: darwin/amd64
            runner: macos-15-intel
          - target: darwin-arm64
            go_target: darwin/arm64
            runner: macos-15

    steps:
      - name: Check out Tinear
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.go_target }}"
          test "$(go env CGO_ENABLED)" = "1"

      - name: Install Ard
        shell: bash
        run: |
          scripts/install-ard.sh "$ARD_VERSION" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          ard deps fetch
          mkdir -p "$RUNNER_TEMP/package"
          ard build main.ard --out "$RUNNER_TEMP/package/tinear"
          tar -czf "tinear-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/package" tinear

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinear-${{ matrix.target }}
          path: tinear-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tinear-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum tinear-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
