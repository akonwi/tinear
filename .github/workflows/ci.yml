name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARD_VERSION: v0.40.0
  CGO_ENABLED: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Check out Tinear
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Ard
        shell: bash
        run: |
          scripts/install-ard.sh "$ARD_VERSION" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: |
          go mod download
          ard deps fetch

      - name: Check and test
        run: |
          ard check main.ard
          ard build main.ard --out "$RUNNER_TEMP/tinear"
          ard test
          go test ./...

      - name: Check PTY scripts
        run: python3 -m py_compile test/pty/harness.py test/pty/test_tinear.py

      - name: Run live-terminal smoke test
        if: runner.os == 'Linux'
        env:
          ARD: ard
        run: python3 test/pty/test_tinear.py

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
