name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tinear
        uses: actions/checkout@v7

      # go.mod replaces vaxis with a sibling checkout (../vaxis). Pin the
      # same upstream commit the local sibling tracks.
      - name: Checkout vaxis sibling
        run: |
          git clone https://github.com/rockorager/vaxis.git "$GITHUB_WORKSPACE/../vaxis"
          git -C "$GITHUB_WORKSPACE/../vaxis" checkout 24ba647

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # Pin Ard to a released version. Bump ARD_VERSION to upgrade.
      - name: Install Ard
        env:
          ARD_VERSION: v0.28.0
        run: |
          curl -fsSL -o /tmp/ard.tar.gz \
            "https://github.com/akonwi/ard/releases/download/${ARD_VERSION}/ard_${ARD_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/ard.tar.gz -C /tmp
          sudo install /tmp/ard /usr/local/bin/ard

      - name: Verify Ard compiler
        run: ard version

      - name: Download Go dependencies
        run: go mod download

      - name: Fetch Ard dependencies
        run: ard deps fetch

      - name: Run Go tests (ffi packages)
        run: go test ./ffi/...

      - name: Build tinear
        run: ard build main.ard --out /tmp/tinear

      - name: Run Ard tests
        run: ard test
